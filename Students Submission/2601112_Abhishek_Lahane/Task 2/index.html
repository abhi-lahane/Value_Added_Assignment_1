<html>
<head>
    <title>Student Portal Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <img src="/Task 2/Assets/17.png" alt="Student Logo">
            <h2>Student<br>Portal</h2>
        </div>

        <nav class="menu">
            <a href="#" class="active">
                <img src="/Task 2/Assets/13.png" alt="">
                <span>Dashboard</span>
            </a>

            <a href="#">
                <img src="/Task 2/Assets/12.png" alt="">
                <span>Assignments</span>
            </a>

            <a href="#">
                <img src="/Task 2/Assets/11.png" alt="">
                <span>Courses</span>
            </a>

            <a href="#">
                <img src="/Task 2/Assets/10.png" alt="">
                <span>Progress</span>
            </a>

            <a href="#">
                <img src="/Task 2/Assets/09.png" alt="">
                <span>Profile</span>
            </a>
        </nav>

        <div class="logout">
            <a href="#">
                <img src="/Task 2/Assets/08.png" alt="">
                <span>Logout</span>
            </a>
        </div>

    </aside>

    <!-- Main Dashboard -->
    <main class="main">

        <!-- Header -->
        <header class="topbar">

            <h1>Dashboard</h1>

            <div class="user-section">

                <div class="notification">
                    <img src="/Task 2/Assets/16.png" alt="Notification">
                    <span class="notification-dot"></span>
                </div>

                <img class="user-image" src="/Task 2/Assets/15.png" alt="User">

                <h3>Prathmesh</h3>

                <span class="arrow"></span>

            </div>

        </header>

        <div class="content">

            <!-- Welcome Section -->
            <section class="welcome">

                <div class="welcome-text">
                    <h1>Welcome Back, Prathmesh!<span>👋</span></h1>

                    <p>
                        Continue your learning journey and complete your<br>
                        pending assignments.
                    </p>
                </div>

                <div class="welcome-image">
                    <img src="/Task 2/Assets/18.png" alt="Learning Illustration">
                </div>

            </section>
</body>
</html>
